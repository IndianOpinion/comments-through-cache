# nginx FastCGI cache rules for comments-through-cache (cases C13 to C16).
# Paths and zone names are examples; adjust them to your server.

# --- http {} context -------------------------------------------------------

fastcgi_cache_path /var/cache/nginx/wordpress levels=1:2 keys_zone=wordpress:100m inactive=60m max_size=1g;

# The key MUST include $request_method, so a HEAD response never answers a
# GET and the file purger can compute every stored key. The file purger's
# default COMMENTS_THROUGH_CACHE_FILE_KEY matches this line exactly.
fastcgi_cache_key "$scheme$request_method$host$request_uri";

# C13: bypass on the commenter cookie (and the usual WordPress cookies).
map $http_cookie $ctc_skip_cookie {
    default                 0;
    ~*comment_author_       1;
    ~*wordpress_logged_in_  1;
    ~*wp-postpass_          1;
}

# C14: bypass on the post-comment redirect URL.
map $args $ctc_skip_args {
    default                                   0;
    ~*(^|&)(unapproved|moderation-hash)=      1;
}

# C16: only GET and HEAD are cacheable.
map $request_method $ctc_skip_method {
    default 1;
    GET     0;
    HEAD    0;
}

